name: Facefield
options:
  bundleIdPrefix: com.thebehera
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: E8JYF6E4H9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Facefield:
    type: application
    platform: iOS
    sources:
      - Facefield
    postCompileScripts:
      # bundle the same page GitHub Pages serves, so the app works without a deploy
      - name: Bundle Facefield page
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web"
          cp "$SRCROOT/../facefield/index.html" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web/index.html"
        inputFiles:
          - $(SRCROOT)/../facefield/index.html
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/web/index.html
    info:
      path: Facefield/Info.plist
      properties:
        CFBundleDisplayName: Facefield
        NSCameraUsageDescription: Facefield uses the TrueDepth camera to track your face and measure depth.
        NSMicrophoneUsageDescription: Facefield listens to your voice so the face ripples when you talk.
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit, front-facing-camera]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thebehera.facefield
        TARGETED_DEVICE_FAMILY: "1"
